<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="main.css">
  <title>Guta Flores — Overlay Solo Vertical (1080x1920)</title>
  <style>
    /* Adaptaciones específicas para Formato Solo Vertical (1080x1920) */
    html, body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
    }

    .main-border {
      width: 1080px;
      height: 1920px;
      padding: 16px;
    }

    /* Header superior */
    .top-header {
      top: 40px;
      font-size: 28px;
      padding: 14px 52px;
      border-radius: 40px;
    }

    .top-header .badge {
      font-size: 18px;
      padding: 6px 18px;
      border-radius: 20px;
    }

    /* LAYOUT MODO SOLO VERTICAL */
    .solo-vertical-layout {
      position: absolute;
      top: 140px;
      left: 28px;
      right: 28px;
      bottom: 110px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Contenedor Cámara Solo (9:16 Vertical Completo) */
    .solo-cam-box {
      width: 100%;
      height: 100%;
      max-height: 1600px;
      position: relative;
      border-radius: 24px;
      padding: 10px;
      background: linear-gradient(45deg, #8B0000, #1A1A1A, #C0392B, #FFD700, #8B0000);
      background-size: 300% 300%;
      animation: borderGlow 6s ease infinite;
      box-shadow:
        0 0 50px rgba(139, 0, 0, 0.6),
        0 0 100px rgba(139, 0, 0, 0.25),
        0 25px 50px rgba(0, 0, 0, 0.9);
    }

    .solo-cam-box .cam-window {
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.05);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    /* Etiqueta de Nombre Grande para Vertical Solo */
    .name-tag-vertical-solo {
      position: absolute;
      bottom: -28px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #0d0d0d 0%, #2a0000 50%, #0d0d0d 100%);
      border: 3px solid #C0392B;
      border-radius: 16px;
      padding: 10px 48px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.95), 0 0 20px rgba(192, 57, 43, 0.5);
      white-space: nowrap;
      z-index: 5;
    }

    .name-tag-vertical-solo .role-title {
      color: #E74C3C;
      font-size: 15px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 3px;
    }

    .name-tag-vertical-solo .user-name {
      color: #FFFFFF;
      font-size: 28px;
      font-weight: 900;
      margin-top: 2px;
      letter-spacing: 2px;
      text-shadow: 0 0 20px rgba(192, 57, 43, 0.6);
    }

    /* Ticker inferior adaptado para Vertical */
    .ticker-bar-vertical {
      position: absolute;
      bottom: 24px;
      left: 24px;
      right: 24px;
      height: 64px;
      background: linear-gradient(90deg, #0d0d0d 0%, #1a0000 40%, #0d0d0d 100%);
      border: 2px solid #C0392B;
      border-radius: 12px;
      display: flex;
      align-items: center;
      overflow: hidden;
      z-index: 20;
      box-shadow: 0 0 24px rgba(139, 0, 0, 0.6), inset 0 1px 0 rgba(255, 215, 0, 0.15);
    }

    .ticker-bar-vertical .ticker-label {
      flex-shrink: 0;
      background: linear-gradient(135deg, #8B0000, #C0392B);
      color: #FFD700;
      font-weight: 900;
      font-size: 17px;
      padding: 0 22px;
      height: 100%;
      display: flex;
      align-items: center;
      letter-spacing: 2px;
      text-transform: uppercase;
      border-right: 2px solid #FFD700;
      gap: 10px;
      white-space: nowrap;
    }

    .ticker-bar-vertical .ticker-content {
      font-size: 22px;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- Marco General Animado -->
  <div class="main-border">
    <div class="main-inner">

      <!-- Encabezado / Título -->
      <div class="top-header">
        <span class="badge">● EN VIVO</span>
        <span data-bind="host-name">Guta Flores</span>
      </div>

      <!-- Estructura Solo Vertical -->
      <div class="solo-vertical-layout">
        <div class="solo-cam-box">
          <div class="cam-window"></div>
          
          <div class="name-tag-vertical-solo">
            <div class="role-title" data-bind="host-role">🎙️ ANFITRIÓN / HOST</div>
            <div class="user-name" data-bind="host-name">GUTA FLORES</div>
          </div>
        </div>
      </div>

      <div class="corner-stripe-left"></div>
      <div class="corner-stripe-right"></div>

      <!-- TICKER — Texto destacado animado (Sincronizado con Panel) -->
      <div class="ticker-bar-vertical">
        <div class="ticker-label">
          <span class="ticker-dot"></span>
          ✨ DESTACADO
        </div>
        <div class="ticker-track">
          <div class="ticker-content" data-bind="ticker-content">
            🎙️ Transmisión en vivo: <span class="highlight">GUTA FLORES</span>
            <span class="sep">◆</span>
            🌟 ¡Bienvenidos al stream!
            <span class="sep">◆</span>
            📲 Seguinos en redes: <span class="highlight">@gutaflores</span>
            <span class="sep">◆</span>
            🎶 Música, folklore y entretenimiento en vivo
            <span class="sep">◆</span>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="script-overlay.js"></script>
</body>
</html>
