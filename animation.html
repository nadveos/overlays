<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animación Tap Móvil - Transparente</title>
    <style>
        /* --- RESET Y FONDO TRANSPARENTE --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: transparent;
            /* Fondo general transparente */
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
        }

        /* --- MARCO DEL MÓVIL MÁS GRANDE --- */
        .phone {
            position: relative;
            width: 380px;
            /* Tamaño ampliado */
            height: 750px;
            /* Tamaño ampliado */
            background: #0f172a;
            border-radius: 48px;
            border: 14px solid #1e293b;
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.4),
                0 0 0 2px rgba(255, 255, 255, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Isla dinámica / Notch superior */
        .phone::before {
            content: '';
            position: absolute;
            top: 12px;
            width: 120px;
            height: 28px;
            background: #000;
            border-radius: 20px;
            z-index: 30;
        }

        /* Contenido de la pantalla (Fondo oscuro para contraste) */
        .screen {
            position: relative;
            width: 100%;
            height: 100%;
            /* Fondo azul/violeta oscuro para contrastar fuertemente con los corazones rojos */
            background: linear-gradient(180deg, #0f172a 0%, #1e1b4b 60%, #31103f 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            user-select: none;
        }

        .screen h2 {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        .screen p {
            font-size: 1rem;
            opacity: 0.8;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        /* --- EL DEDO Y EFECTO TAP --- */
        .finger {
            position: absolute;
            top: 50%;
            left: 50%;
            font-size: 80px;
            /* Dedo más grande */
            pointer-events: none;
            z-index: 25;
            transform-origin: 20% 20%;
            animation: tapAnimation 1.8s infinite cubic-bezier(0.4, 0, 0.2, 1);
            filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.5));
        }

        /* Onda expansiva (Ripple) al presionar */
        .tap-ripple {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 80px;
            height: 80px;
            border: 3px solid rgba(255, 99, 132, 0.8);
            background: rgba(255, 99, 132, 0.25);
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(0);
            z-index: 5;
            animation: rippleAnimation 1.8s infinite cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* --- CORAZONES MÁS GRANDES Y VISIBLES --- */
        .heart {
            position: absolute;
            pointer-events: none;
            z-index: 20;
            font-size: 36px;
            /* Corazones considerablemente más grandes */
            /* Sombra y resplandor para destacar en cualquier fondo */
            filter: drop-shadow(0 0 12px rgba(255, 40, 100, 0.9)) drop-shadow(0 0 4px rgba(255, 255, 255, 0.8));
            animation: floatUp 1.3s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        /* --- ANIMACIONES CSS --- */
        @keyframes tapAnimation {

            0%,
            100% {
                transform: translate(0, 0) scale(1) rotate(0deg);
            }

            40% {
                transform: translate(-15px, -20px) scale(1.15) rotate(-8deg);
            }

            50% {
                transform: translate(0, 0) scale(0.85) rotate(0deg);
            }

            60% {
                transform: translate(0, 0) scale(1) rotate(0deg);
            }
        }

        @keyframes rippleAnimation {

            0%,
            48% {
                transform: translate(-50%, -50%) scale(0);
                opacity: 0;
            }

            50% {
                transform: translate(-50%, -50%) scale(0.3);
                opacity: 1;
            }

            80% {
                transform: translate(-50%, -50%) scale(2.2);
                opacity: 0;
            }

            100% {
                transform: translate(-50%, -50%) scale(2.2);
                opacity: 0;
            }
        }

        @keyframes floatUp {
            0% {
                transform: translate(-50%, -50%) scale(0.4) rotate(0deg);
                opacity: 1;
            }

            15% {
                opacity: 1;
            }

            100% {
                transform: translate(calc(-50% + var(--tx)), calc(-50% - 180px)) scale(var(--scale)) rotate(var(--rot));
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div class="phone">
        <div class="screen" id="screen">
            <h2>¡Doble Tap!</h2>
            <p>Dejá tu like ❤️❤️❤️</p>

            <!-- Onda visual del tap -->
            <div class="tap-ripple"></div>

            <!-- Emoji del dedo -->
            <div class="finger" id="finger">👆</div>
        </div>
    </div>

    <script>
        const screen = document.getElementById('screen');
        const finger = document.getElementById('finger');

        // Lista de emojis de corazones para variedad visual
        const heartTypes = ['❤️', '💖', '💗', '💕'];

        function createHeart(x, y) {
            const heart = document.createElement('div');
            heart.classList.add('heart');

            // Seleccionar un tipo de corazón al azar
            heart.innerHTML = heartTypes[Math.floor(Math.random() * heartTypes.length)];

            // Coordenadas iniciales centradas en el tap
            heart.style.left = `${x}px`;
            heart.style.top = `${y}px`;

            // Variables dinámicas para trayectoria, tamaño y rotación
            const randomX = (Math.random() - 0.5) * 220; // Mayor dispersión lateral
            const randomScale = 1.0 + Math.random() * 0.7; // Escala más grande (1.0x a 1.7x)
            const randomRot = (Math.random() - 0.5) * 80;  // Rotación en grados

            heart.style.setProperty('--tx', `${randomX}px`);
            heart.style.setProperty('--scale', randomScale);
            heart.style.setProperty('--rot', `${randomRot}deg`);

            screen.appendChild(heart);

            // Eliminar elemento al finalizar animación
            setTimeout(() => {
                heart.remove();
            }, 1300);
        }

        function triggerHearts() {
            const rect = screen.getBoundingClientRect();
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;

            // Generar 7 corazones en abanico
            for (let i = 0; i < 7; i++) {
                setTimeout(() => {
                    createHeart(centerX, centerY);
                }, i * 50);
            }
        }

        // Disparar en el momento justo del tap (50% de la animación CSS)
        finger.addEventListener('animationiteration', triggerHearts);

        // Primer disparo al cargar
        setTimeout(triggerHearts, 900);
    </script>

</body>

</html>
