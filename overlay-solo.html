<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="main.css">
  <title>Guta Flores — Overlay Solo Horizontal</title>
  <style>
    /* Estilos específicos para Modo Solo Horizontal (16:9) */
    .cam-solo-wrapper {
      position: absolute;
      top: 72px;
      bottom: 54px;
      left: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .cam-solo-container {
      width: 100%;
      max-width: 1380px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .cam-solo-box {
      width: 100%;
      aspect-ratio: 16 / 9;
      max-height: calc(100vh - 190px);
      position: relative;
      border-radius: 18px;
      background: transparent;
      box-shadow:
        0 0 40px rgba(139, 0, 0, 0.5),
        0 0 80px rgba(139, 0, 0, 0.2),
        0 20px 40px rgba(0, 0, 0, 0.85);
    }

    .cam-solo-box::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 18px;
      padding: 9px;
      background: linear-gradient(45deg, #8B0000, #1A1A1A, #C0392B, #FFD700, #8B0000);
      background-size: 300% 300%;
      animation: borderGlow 6s ease infinite;
      -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);
      -webkit-mask-composite: destination-out;
      mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);
      mask-composite: exclude;
      pointer-events: none;
    }

    .cam-solo-box .cam-window {
      width: 100%;
      height: 100%;
      background: transparent;
      border-radius: 12px;
    }

    .name-tag-solo {
      position: absolute;
      bottom: -26px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #0d0d0d 0%, #2a0000 50%, #0d0d0d 100%);
      border: 2.5px solid #C0392B;
      border-radius: 12px;
      padding: 8px 40px;
      text-align: center;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.9), 0 0 16px rgba(192, 57, 43, 0.5);
      white-space: nowrap;
      z-index: 5;
    }

    .name-tag-solo .role-title {
      color: #E74C3C;
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .name-tag-solo .user-name {
      color: #FFFFFF;
      font-size: 26px;
      font-weight: 900;
      margin-top: 2px;
      letter-spacing: 2px;
      text-shadow: 0 0 20px rgba(192, 57, 43, 0.6);
    }

    .side-deco {
      position: absolute;
      top: 90px;
      bottom: 58px;
      width: 10px;
      border-radius: 5px;
      background: repeating-linear-gradient(
        180deg,
        #8B0000 0px, #8B0000 12px,
        #1A1A1A 12px, #1A1A1A 20px,
        #C0392B 20px, #C0392B 32px,
        #1A1A1A 32px, #1A1A1A 40px,
        #FFD700 40px, #FFD700 44px,
        #1A1A1A 44px, #1A1A1A 52px
      );
      opacity: 0.7;
    }
    .side-deco-left  { left: 16px; }
    .side-deco-right { right: 16px; }
  </style>
</head>
<body>

  <div class="main-border">
    <div class="main-inner">

      <!-- Encabezado / Título -->
      <div class="top-header">
        <span class="badge">● EN VIVO</span>
        <span data-bind="host-name">Guta Flores</span>
      </div>

      <!-- Franjas decorativas laterales -->
      <div class="side-deco side-deco-left"></div>
      <div class="side-deco side-deco-right"></div>

      <!-- Cámara Principal Modo Solo (16:9 Centrado) -->
      <div class="cam-solo-wrapper">
        <div class="cam-solo-container">
          <div class="cam-solo-box">
            <div class="cam-window"></div>

            <div class="name-tag-solo">
              <div class="role-title" data-bind="host-role">🎙️ ANFITRIÓN / HOST</div>
              <div class="user-name" data-bind="host-name">GUTA FLORES</div>
            </div>
          </div>
        </div>
      </div>

      <!-- BANNER DE FRASES / MOTTO BANNER -->
      <div class="motto-banner" style="position: absolute; bottom: 50px; left: 10px; right: 10px; width: auto; padding: 5px 16px; border-radius: 6px;">
        <div class="motto-text-group">
          <span class="motto-phrase highlight" style="font-size: 14px;">🎙️ DIFUNDIENDO ARTISTAS POCOS CONOCIDOS</span>
          <span class="motto-connector" style="font-size: 14px; width: 22px; height: 22px;">Y</span>
          <span class="motto-phrase" style="font-size: 14px;">GUITARREAMOS A LA GORRA 🪕</span>
        </div>
      </div>

      <!-- TICKER — Texto destacado animado (Sincronizado con Panel) -->
      <div class="ticker-bar">
        <div class="ticker-label">
          <span class="ticker-dot"></span>
          ✨ DESTACADO
        </div>
        <div class="ticker-track">
          <div class="ticker-content" data-bind="ticker-content">
            🎙️ Transmisión en vivo: <span class="highlight">GUTA FLORES</span>
            <span class="sep">◆</span>
            🌟 ¡Bienvenidos al stream!
            <span class="sep">◆</span>
            📲 Seguinos en redes: <span class="highlight">@gutaflores</span>
            <span class="sep">◆</span>
            🎶 Música, folklore y entretenimiento en vivo
            <span class="sep">◆</span>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="script-overlay.js"></script>
</body>
</html>
